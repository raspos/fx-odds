name: daily
on:
  push:
    branches: [main]            # 코드를 푸시하면 자동으로 배포 (봇의 데이터 커밋은 GITHUB_TOKEN 이라 다시 트리거하지 않는다)
    paths-ignore: ["README.md", "docs/**"]
  schedule:
    - cron: "40 9 * * 1-5"      # 평일 18:40 KST (서울 종가·ECOS 반영 이후)
    - cron: "40 23 * * 0-4"     # 평일 08:40 KST (미국장 마감 후 뉴스·Yahoo·GPR 갱신)
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: daily
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m pytest tests -q -W ignore
      - name: 수집·분석 (실패 시 이전 데이터 유지)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python py/run_daily.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - name: 데이터·실시간 예측 기록 커밋 (덮어쓰기 없이 추가만)
        run: |
          git config user.name "fx-odds-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fx.sqlite data/live_forecasts.csv data/fetch_status.json data/news.jsonl data/npi_log.csv
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase -X theirs origin main   # main 이 앞서가면 이 실행이 새로 만든 데이터(바이너리 DB 포함)를 우선해 충돌 없이 얹는다
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
