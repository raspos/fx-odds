name: daily
on:
  push:
    branches: [main]            # 코드를 푸시하면 자동 배포(수집·백테스트 없이 저장된 데이터로 빠르게). 봇의 데이터 커밋은 GITHUB_TOKEN 이라 다시 트리거하지 않는다
    paths-ignore: ["README.md", "docs/**"]
  schedule:
    - cron: "40 9 * * 1-5"      # 평일 18:40 KST (서울 종가·ECOS 반영 이후) — 전체 수집·분석
    - cron: "40 23 * * 0-4"     # 평일 08:40 KST (미국장 마감 후 뉴스·Yahoo·GPR 갱신) — 전체 수집·분석
  workflow_dispatch: {}         # 수동 실행도 전체 수집·분석
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: daily
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FULL: ${{ github.event_name != 'push' }}   # push 면 false: 수집·백테스트 재계산을 건너뛴다
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }       # 항상 최신 main(봇이 올린 최신 데이터 포함)으로 빌드
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m pytest tests -q -W ignore
      - name: 백테스트 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            data/bt.pkl
            data/latest_mu.json
          key: bt-${{ github.run_id }}
          restore-keys: bt-
      - name: 수집·분석 (전체 — 실패 시 이전 데이터 유지)
        if: env.FULL == 'true'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python py/run_daily.py
      - name: 분석만 (저장된 데이터·백테스트 캐시 사용, 수집 없음)
        if: env.FULL != 'true'
        run: python py/build.py --skip-bt --no-live
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web
      - name: 데이터·실시간 예측 기록 커밋 (덮어쓰기 없이 추가만)
        if: env.FULL == 'true'
        run: |
          git config user.name "fx-odds-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fx.sqlite data/live_forecasts.csv data/fetch_status.json data/news.jsonl data/npi_log.csv data/ai_news.jsonl data/ai_usage.csv data/fx_reports.jsonl data/ai_comment.jsonl
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase -X theirs origin main   # main 이 앞서가면 이 실행이 새로 만든 데이터(바이너리 DB 포함)를 우선해 충돌 없이 얹는다
          git push
      - name: 시장 호가도 함께 갱신 (전체 실행 때마다 확실히 한 번 — 호가 전용 스케줄이 빠져도 하루 두 번은 갱신된다)
        if: env.FULL == 'true'
        continue-on-error: true
        run: |
          python py/quote.py quote.json
          mkdir q && cp quote.json q/ && cd q
          git init -q -b quote && git config user.name fx-odds-bot && git config user.email bot@users.noreply.github.com
          git add quote.json && git commit -q -m "quote"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" quote
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
