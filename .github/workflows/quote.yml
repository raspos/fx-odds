name: quote
on:
  schedule:
    - cron: "*/10 0-7 * * 1-5"   # 평일 09:00~16:50 KST, 10분마다 (GitHub 실제 실행은 몇 분 밀릴 수 있다)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: quote
  cancel-in-progress: true
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 호가 수집 (실패하면 기존 값을 그대로 둔다)
        run: python py/quote.py quote.json
      - name: quote 브랜치에 한 커밋으로 덮어쓰기 (이력을 쌓지 않는다)
        run: |
          mkdir q && cp quote.json q/ && cd q
          git init -q -b quote && git config user.name fx-odds-bot && git config user.email bot@users.noreply.github.com
          git add quote.json && git commit -q -m "quote"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" quote
